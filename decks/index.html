<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141d28">
  <title>ShadowBattle Deckbuilder</title>
  <link rel="dns-prefetch" href="//shadowverse-portal.com">
  <link rel="preconnect" href="https://shadowverse-portal.com">
  <link rel="stylesheet" href="../src/ui/deckbuilder.css?v=0.4.83">
  <link rel="stylesheet" href="../src/ui/deck-enhancements.css?v=0.4.83">
  <link rel="stylesheet" href="../src/ui/beyond-decks-v2.css?v=0.4.83">
  <link rel="stylesheet" href="../src/ui/deck-assistant.css?v=0.4.83">
  <script type="module" src="../src/ui/version-guard.js?v=0.4.83"></script>
</head>
<body class="db-page" data-game="shadowverse-ccg">
  <header class="db-app-header">
    <div class="db-header-toolbar">
      <div id="deck-game-switch" class="db-segment-group db-game-switch" aria-label="Game">
        <button type="button" class="active" data-game-select="shadowverse-ccg" title="Shadowverse CCG">SV1</button>
        <button type="button" data-game-select="champions-battle" title="Champion's Battle">CB</button>
      </div>
      <div id="deck-craft-buttons" class="db-craft-list" aria-label="Craft"></div>
      <div id="deck-rarity-filter" class="db-rarity-list" aria-label="Rarity filters"></div>
      <div class="db-header-actions">
        <a class="db-button" href="../">Home</a>
        <a class="db-button" href="../library/">Deck Library</a>
        <a class="db-button" href="../api/">API</a>
        <button id="export-shadowbattle-deck" class="db-button" type="button">Export</button>
        <button id="new-deck" class="db-button db-danger" type="button">Clear deck</button>
      </div>
    </div>
    <div class="db-subtoolbar">
      <button id="filters-drawer-toggle" class="db-button db-filter-toggle" type="button" aria-controls="filters-sidebar" aria-expanded="false">Filters</button>
      <strong id="deck-result-count" class="db-result-count">0 cards</strong>
      <div id="deck-cost-filter" class="db-cost-filter" aria-label="Cost filter"></div>
      <div id="deck-type-filter" class="db-type-filter" aria-label="Type filter"></div>
      <div class="db-view-controls">
        <label class="db-format-control"><span>Format</span><select id="deck-format" disabled><option>Unlimited</option></select></label>
        <label class="db-card-size-control"><span>Card size</span><input id="deck-card-size" type="range" min="74" max="190" step="2" value="156"></label>
        <div class="db-card-size-presets" aria-label="Card size presets">
          <button type="button" data-card-size-preset="fit" class="active">Fit</button>
          <button type="button" data-card-size-preset="90">S</button>
          <button type="button" data-card-size-preset="118">M</button>
          <button type="button" data-card-size-preset="154">L</button>
        </div>
      </div>
      <button id="reset-filters" class="db-button db-reset-filters" type="button">Reset filters</button>
    </div>
  </header>
  <main class="db-app-shell">
    <aside id="filters-sidebar" class="db-sidebar" aria-hidden="true">
      <div class="db-filter-drawer-head"><strong>Filters</strong><button id="filters-drawer-close" type="button" aria-label="Close filters">×</button></div>
      <section><h2>Search</h2><input id="deck-search" class="db-input" type="search" placeholder="Search cards, effects, traits…"></section>
      <section>
        <h2>Game</h2>
        <label class="db-field"><span>Dataset</span><select id="deck-game"><option value="shadowverse-ccg">Shadowverse CCG</option><option value="champions-battle">Champion's Battle</option></select></label>
        <label class="db-field"><span>Craft</span><select id="deck-craft"></select></label>
      </section>
      <section><h2>Set</h2><select id="deck-set" class="db-input"><option value="all">All sets</option></select></section>
      <section><div class="db-assistant-filter-head"><h2>Traits</h2><small>deck synergy</small></div><div id="deck-trait-filter" class="db-assistant-filter-list" aria-label="Trait filters"></div></section>
      <section><div class="db-assistant-filter-head"><h2>Keywords</h2><small>effect mechanics</small></div><div id="deck-keyword-filter" class="db-assistant-filter-list" aria-label="Keyword filters"></div></section>
    </aside>
    <section class="db-content" aria-label="Card catalog">
      <div id="deck-status" class="db-status" role="status" data-visible="true">Loading local catalogs…</div>
      <div id="deck-results" class="db-card-grid"></div>
      <button id="back-to-top" class="db-back-to-top" type="button" hidden>↑ Top</button>
    </section>
    <aside class="db-deck-panel" aria-label="Deck sidebar">
      <div class="db-tabs db-tabs-two" role="tablist" aria-label="Deck tools">
        <button type="button" class="db-tab active" data-db-tab="deck" aria-selected="true">Deck</button>
        <button type="button" class="db-tab" data-db-tab="saved" aria-selected="false">Saved</button>
      </div>
      <section class="db-tab-content active" data-db-panel="deck">
        <div class="db-deck-header"><h2>Deck</h2><strong id="current-deck-count">0 / 40</strong></div>
        <span id="deck-legality" data-legal="false" hidden>40 cards remaining</span>
        <div class="db-deck-toolbar">
          <select id="deck-sort" aria-label="Deck sort"><option value="cost">Sort: Cost</option><option value="name">Sort: Name</option><option value="set">Sort: Set</option></select>
          <button id="deck-compact-toggle" type="button" class="active">Compact</button>
        </div>
        <div id="deck-cost-strip" class="db-deck-cost-strip" aria-label="Deck cost curve"></div>
        <div class="db-deck-section-title"><span>Main deck</span><strong id="main-deck-count">0 / 40</strong></div>
        <div id="current-deck" class="db-current-deck"></div>
      </section>
      <section class="db-tab-content" data-db-panel="saved" hidden>
        <div class="db-deck-header"><h2>Deck variants</h2><a class="db-library-link" href="../library/">Library ↗</a></div>
        <div class="db-saved-compose"><input id="deck-name" class="db-input" type="text" maxlength="80" placeholder="Variant name"><button id="save-deck" class="db-button db-primary" type="button">Save</button></div>
        <div id="saved-decks" class="db-saved-list"></div>
      </section>
      <section data-db-panel="import" hidden aria-hidden="true">
        <button id="import-beyond-local" type="button"></button><input id="import-beyond-file" type="file"><textarea id="beyond-import-json"></textarea><button id="import-beyond-json" type="button"></button>
      </section>
    </aside>
  </main>
  <button id="filters-drawer-backdrop" class="db-filter-backdrop" type="button" aria-label="Close filters" hidden></button>
  <dialog id="card-preview-dialog" class="db-preview-dialog">
    <div class="db-preview-head"><div><div id="card-preview-meta" class="db-preview-meta"></div><h2 id="card-preview-title">Card preview</h2></div><button id="card-preview-close" class="db-icon-button" type="button" aria-label="Close preview">×</button></div>
    <div class="db-preview-layout">
      <div class="db-preview-image-wrap"><img id="card-preview-image" alt="" referrerpolicy="no-referrer"><div id="card-preview-art-controls" class="db-preview-art-controls"><button id="card-preview-normal" type="button" class="active">Normal</button><button id="card-preview-evolved" type="button">Evolved</button></div></div>
      <div class="db-preview-info"><div id="card-preview-stats" class="db-preview-stats"></div><div id="card-preview-text" class="db-preview-text"></div><button id="card-preview-add" type="button" class="db-button db-primary db-preview-add">Add to deck</button></div>
    </div>
  </dialog>
  <script src="../src/ui/deck-ui-enhancements.js?v=0.4.83"></script>
  <script src="../src/ui/deck-polish.js?v=0.4.83"></script>
  <script type="module" src="../src/decks/deckbuilder-page.js?v=0.4.83"></script>
  <script type="module" src="../src/decks/deck-assistant-page.js?v=0.4.83"></script>
  <script type="module" src="../src/decks/deck-session.js?v=0.4.83"></script>
</body>
</html>
