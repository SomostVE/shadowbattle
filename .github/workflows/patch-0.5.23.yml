name: Patch 0.5.23

on:
  push:
    branches:
      - engine-v6-0.5.23-pixie-hand-x
    paths:
      - scripts/patch-0.5.23.mjs
      - .github/workflows/patch-0.5.23.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.23-pixie-hand-x
      - name: Apply guarded patch
        run: node scripts/patch-0.5.23.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/class-conditions.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: resolve Pixie followers in hand X"
          git push origin HEAD:engine-v6-0.5.23-pixie-hand-x
