name: Sync Public Version

on:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/sync-public-version.mjs
      - .github/workflows/sync-public-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Synchronize public version references
        run: node scripts/sync-public-version.mjs
      - name: Commit synchronized pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/index.html test/index.html decks/index.html library/index.html
          if git diff --cached --quiet; then
            echo "Public version references already synchronized."
            exit 0
          fi
          git commit -m "chore: sync public version references"
          git push
