name: Sync Worlds Beyond Fan Kit

on:
  push:
    branches: [main]
    paths:
      - scripts/sync-worlds-beyond-fankit.mjs
      - .github/workflows/sync-worlds-beyond-fankit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Discover official Worlds Beyond Fan Kit assets
        run: node scripts/sync-worlds-beyond-fankit.mjs
      - name: Commit discovery metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fankits/worlds-beyond/discovery.json
          if git diff --cached --quiet; then
            echo "Fan Kit discovery unchanged."
            exit 0
          fi
          git commit -m "chore: refresh Worlds Beyond Fan Kit discovery"
          git push
