name: Patch 0.5.21

on:
  push:
    branches: [engine-v6-0.5.21-other-allied-cards-x]
    paths:
      - scripts/patch-0.5.21.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.21-other-allied-cards-x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply 0.5.21 engine patch
        run: node scripts/patch-0.5.21.mjs
      - name: Commit engine patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/class-conditions.js src/core/rulesets/svwb/generic-effects.js src/core/rulesets/svwb/effect-resolver.js
          git commit -m "feat: resolve other-allied-card destruction X"
          git push
