name: Patch V6 AI branch

on:
  push:
    branches: [ai/v6-intermediate-controller-0.4.81]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai/v6-intermediate-controller-0.4.81
      - name: Patch Battle Lab
        run: python scripts/patch-ai-lab.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/test/battle-action-lab.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use V6 intermediate AI in Battle Lab"
          git push origin HEAD:ai/v6-intermediate-controller-0.4.81
