name: Validate ShadowBattle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.46-countdown-adjustments
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply staged 0.5.46 Crest grammar fix
        run: python scripts/fix-0.5.46-crest-colon.py
      - name: Check JavaScript syntax
        run: |
          for file in $(find src tests -type f -name '*.js' | sort); do
            node --check "$file"
          done
      - name: Check API JSON
        run: |
          node -e "const fs=require('fs');for(const file of require('child_process').execSync('find api -type f -name \"*.json\"').toString().trim().split(/\n+/).filter(Boolean)){JSON.parse(fs.readFileSync(file,'utf8'));console.log('OK '+file)}"
      - name: Run tests
        run: npm test
      - name: Audit SVWB structural coverage
        run: npm run audit:svwb
      - name: Commit validated 0.5.46 Crest grammar fix
        run: |
          if git diff --quiet; then
            echo "0.5.46 Crest grammar fix already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/generic-effects.js
          git commit -m "ShadowBattle 0.5.46 — support official Crest colon grammar"
          git push origin HEAD:engine-v6-0.5.46-countdown-adjustments
