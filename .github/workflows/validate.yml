name: Validate ShadowBattle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.41-destroyed-history-copies
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply staged 0.5.41 patch
        run: python scripts/apply-0.5.41-destroyed-history-copies.py
      - name: Guard generic draw from named tutor compiler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/core/rulesets/svwb/v6/effect-commands.js")
          text = p.read_text()
          old = '''  const named = value.match(/\\bdraw\\s+(?:a|an|one)\\s+([A-Z][A-Za-z0-9'’&,:\\- ]+?)\\s*\\.?\\s*$/i);'''
          new = '''  if (/\\bdraw\\s+(?:a|an|one)\\s+cards?\\s*\\.?\\s*$/i.test(value)) return [];
          const named = value.match(/\\bdraw\\s+(?:a|an|one)\\s+([A-Z][A-Za-z0-9'’&,:\\- ]+?)\\s*\\.?\\s*$/i);'''
          if new not in text:
              if old not in text:
                  raise SystemExit("missing named-draw anchor")
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Check JavaScript syntax
        run: |
          for file in $(find src tests -type f -name '*.js' | sort); do
            node --check "$file"
          done
      - name: Check API JSON
        run: |
          node -e "const fs=require('fs');for(const file of require('child_process').execSync('find api -type f -name \"*.json\"').toString().trim().split(/\n+/).filter(Boolean)){JSON.parse(fs.readFileSync(file,'utf8'));console.log('OK '+file)}"
      - name: Run tests
        run: npm test
      - name: Audit SVWB structural coverage
        run: npm run audit:svwb
      - name: Commit validated 0.5.41 patch
        run: |
          if git diff --quiet; then
            echo "0.5.41 patch already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/match-history.js \
                  src/core/rulesets/svwb/v6/reanimate-command.js \
                  src/core/rulesets/svwb/v6/effect-commands.js \
                  src/core/rulesets/svwb/effect-resolver.js \
                  tests/worlds-beyond-destroyed-history-copies-v6.test.js \
                  package.json version.json index.html api/index.html test/index.html decks/index.html library/index.html
          git commit -m "ShadowBattle 0.5.41 — support destroyed-history copies"
          git push origin HEAD:engine-v6-0.5.41-destroyed-history-copies
