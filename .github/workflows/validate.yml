name: Validate ShadowBattle

on:
  push:
    branches: [main, maintenance-0.5.77-v6-override-runtime-dedup]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply guarded 0.5.77 migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/maintenance-0.5.77-v6-override-runtime-dedup'
        run: node .github/refactor-0.5.77.mjs
      - name: Check JavaScript syntax
        run: |
          for file in $(find src tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) | sort); do
            node --check "$file"
          done
          node --check sw.js
      - name: Check version metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const publicVersion = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          if (pkg.version !== publicVersion.version) {
            throw new Error(`Version mismatch: package.json=${pkg.version}, version.json=${publicVersion.version}`);
          }
          console.log(`Version metadata aligned at ${pkg.version}.`);
          NODE
      - name: Check API JSON
        run: |
          node -e "const fs=require('fs');for(const file of require('child_process').execSync('find api -type f -name \"*.json\"').toString().trim().split(/\n+/).filter(Boolean)){JSON.parse(fs.readFileSync(file,'utf8'));console.log('OK '+file)}"
      - name: Run tests
        run: npm test
      - name: Audit SVWB structural coverage
        run: npm run audit:svwb
      - name: Commit guarded migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/maintenance-0.5.77-v6-override-runtime-dedup'
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/class-conditions.js src/core/rulesets/svwb/generic-effects.js src/core/rulesets/svwb/effect-resolver.js tests/v6-runtime-dedup.test.js
          git diff --cached --check
          git commit -m "refactor: reuse shared V6 override-aware runtime state"
          git push origin HEAD:maintenance-0.5.77-v6-override-runtime-dedup
