name: Validate ShadowBattle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.31-global-allied-buffs
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply staged 0.5.31 patch
        run: python scripts/apply-0.5.31-global-allied-buffs.py
      - name: Check JavaScript syntax
        run: |
          for file in $(find src tests -type f -name '*.js' | sort); do
            node --check "$file"
          done
      - name: Check API JSON
        run: |
          node -e "const fs=require('fs');for(const file of require('child_process').execSync('find api -type f -name \"*.json\"').toString().trim().split(/\n+/).filter(Boolean)){JSON.parse(fs.readFileSync(file,'utf8'));console.log('OK '+file)}"
      - name: Run tests
        run: npm test
      - name: Audit SVWB structural coverage
        run: npm run audit:svwb
      - name: Commit validated 0.5.31 patch
        run: |
          if git diff --quiet; then
            echo "0.5.31 patch already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/generic-effects.js \
                  tests/worlds-beyond-generic-effects-v6.test.js \
                  package.json version.json index.html api/index.html test/index.html decks/index.html library/index.html
          git commit -m "ShadowBattle 0.5.31 — support global allied follower buffs"
          git push origin HEAD:engine-v6-0.5.31-global-allied-buffs
