name: Patch 0.5.21 Random Plural

on:
  push:
    branches: [engine-v6-0.5.21-other-allied-cards-x]
    paths:
      - scripts/patch-0.5.21-random-plural.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.21-other-allied-cards-x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/patch-0.5.21-random-plural.mjs
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/generic-effects.js
          git commit -m "fix: keep random multi-destroy grammar plural"
          git push
