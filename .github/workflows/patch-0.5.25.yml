name: Patch ShadowBattle 0.5.25 Temp

on:
  push:
    branches:
      - engine-v6-0.5.25-basic-cleanup
    paths:
      - scripts/patch-0.5.25.mjs
      - .github/workflows/patch-0.5.25.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.25-basic-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply guarded 0.5.25 source patch
        run: node scripts/patch-0.5.25.mjs
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/combat-readiness.js src/core/rulesets/svwb/ability-evolution.js src/core/rulesets/svwb/v6/effect-commands.js src/core/rulesets/svwb/effect-resolver.js src/core/rulesets/svwb/evolution-actions.js
          git commit -m "feat: expand Basic SVWB effect coverage"
          git pull --rebase origin engine-v6-0.5.25-basic-cleanup
          git push origin HEAD:engine-v6-0.5.25-basic-cleanup
