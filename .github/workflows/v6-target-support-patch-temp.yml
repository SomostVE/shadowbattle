name: V6 Target Support Patch Temp

on:
  push:
    branches: [engine/svwb-completeness-0.4.84]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine/svwb-completeness-0.4.84
      - name: Patch V6 target support
        run: python scripts/patch-v6-target-support-084.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/rulesets/svwb/effect-resolver.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reuse target stripping in V6 support guard"
          git push origin HEAD:engine/svwb-completeness-0.4.84
