name: Patch hidden information AI

on:
  push:
    branches: [ai/v6-hidden-information-0.4.83]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai/v6-hidden-information-0.4.83
      - name: Patch AI controller
        run: python scripts/patch-hidden-ai.py
      - name: Commit hidden information integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ai/intermediate-controller.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use hidden information samples in V6 AI"
          git push origin HEAD:ai/v6-hidden-information-0.4.83
