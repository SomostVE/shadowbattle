name: Audit Basic 0.5.25 Temp

on:
  push:
    branches:
      - engine-v6-0.5.25-basic-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit Basic residuals with full text
        run: node scripts/audit-svwb-v6-basic-temp.mjs
