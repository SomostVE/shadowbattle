name: Release 0.5.25 Temp

on:
  push:
    branches:
      - engine-v6-0.5.25-basic-cleanup
    paths:
      - scripts/release-0.5.25-temp.mjs
      - .github/workflows/release-0.5.25-temp.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.25-basic-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Bump version and sync public caches
        run: node scripts/release-0.5.25-temp.mjs
      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json version.json index.html api/index.html test/index.html decks/index.html library/index.html
          git commit -m "chore: bump ShadowBattle to 0.5.25"
          git pull --rebase origin engine-v6-0.5.25-basic-cleanup
          git push origin HEAD:engine-v6-0.5.25-basic-cleanup
