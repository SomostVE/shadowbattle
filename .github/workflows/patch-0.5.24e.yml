name: Patch 0.5.24e

on:
  push:
    branches:
      - engine-v6-0.5.24-random-multi-damage
    paths:
      - .github/workflows/patch-0.5.24e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.24-random-multi-damage
          fetch-depth: 0
      - name: Apply guarded patch
        run: node scripts/patch-0.5.24d.mjs
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/generic-effects.js src/core/rulesets/svwb/v6/effect-commands.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve Unleashed self-damage shorthand"
          git pull --rebase origin engine-v6-0.5.24-random-multi-damage
          git push origin HEAD:engine-v6-0.5.24-random-multi-damage
