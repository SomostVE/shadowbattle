name: Cleanup 0.5.25 Temp

on:
  workflow_dispatch:
  push:
    branches:
      - engine-v6-0.5.25-basic-cleanup
    paths:
      - .github/workflows/cleanup-0.5.25-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.25-basic-cleanup
          fetch-depth: 0
      - name: Wait for release version commit
        run: |
          for i in {1..12}; do
            git fetch origin engine-v6-0.5.25-basic-cleanup
            git reset --hard origin/engine-v6-0.5.25-basic-cleanup
            if grep -q '"version": "0.5.25"' package.json; then exit 0; fi
            sleep 5
          done
          echo "0.5.25 release commit did not appear" >&2
          exit 1
      - name: Remove temporary release tooling
        run: |
          git rm -f \
            scripts/audit-svwb-v6-basic-temp.mjs \
            scripts/audit-super-evolve-instead-temp.mjs \
            scripts/patch-0.5.25.mjs \
            scripts/release-0.5.25-temp.mjs \
            .github/workflows/audit-basic-0.5.25-temp.yml \
            .github/workflows/patch-0.5.25.yml \
            .github/workflows/fix-patch-0.5.25-temp.yml \
            .github/workflows/validate-0.5.25-temp.yml \
            .github/workflows/fix-0.5.25-regression-tests-temp.yml \
            .github/workflows/release-0.5.25-temp.yml \
            .github/workflows/cleanup-0.5.25-temp.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary 0.5.25 tooling"
          git pull --rebase origin engine-v6-0.5.25-basic-cleanup
          git push origin HEAD:engine-v6-0.5.25-basic-cleanup
