name: Patch 0.5.24

on:
  push:
    branches:
      - engine-v6-0.5.24-random-multi-damage
    paths:
      - scripts/patch-0.5.24.mjs
      - .github/workflows/patch-0.5.24.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: engine-v6-0.5.24-random-multi-damage
      - name: Apply guarded patch
        run: node scripts/patch-0.5.24.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/rulesets/svwb/class-conditions.js src/core/rulesets/svwb/generic-effects.js src/core/rulesets/svwb/v6/effect-commands.js src/core/rulesets/worlds-beyond.js tests/worlds-beyond-random-multi-damage-v6.test.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add ordered random multi-target damage"
          git push origin HEAD:engine-v6-0.5.24-random-multi-damage
